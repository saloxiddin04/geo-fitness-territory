version: '3.9'

services:
  # PostgreSQL + PostGIS database
  postgres:
    image: postgis/postgis:15-3.4
    container_name: geo_fitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geo_fitness
      POSTGRES_USER: geo_user
      POSTGRES_PASSWORD: geo_password_secure_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_user -d geo_fitness"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo_fitness_network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: geo_fitness_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_password_2024
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo_fitness_network

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: geo_fitness_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://geo_user:geo_password_secure_2024@postgres:5432/geo_fitness
      REDIS_URL: redis://:redis_password_2024@redis:6379
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geo_fitness_network

  # Admin Panel (Production build)
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: geo_fitness_admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - geo_fitness_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  geo_fitness_network:
    driver: bridge
